<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPJ Master</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23213a74'/%3E%3Cpath d='M16 6v20M9 11h14M9 11l-3 7h6zM23 11l-3 7h6z' stroke='%23f2c14e' stroke-width='2' fill='none' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --fond: #f3f5f9; --carte: #fff; --carte-2: #f7f8fb; --bord: #e1e5ee; --texte: #18203a; --doux: #5f6882;
    --prim: #213a74; --prim-2: #3657a8; --or: #c9971c; --ok: #1d7a4b; --moyen: #a36a00; --ko: #c0352b;
    --ombre: 0 1px 2px rgba(24, 32, 58, .05), 0 6px 20px rgba(24, 32, 58, .06); --rayon: 14px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) { :root {
    --fond: #0f1320; --carte: #171d2e; --carte-2: #1d2438; --bord: #2b3450; --texte: #e8ebf4; --doux: #9aa3bd;
    --prim: #4f74d1; --prim-2: #7193e6; --or: #f2c14e; --ok: #5fd39a; --moyen: #f0c05a; --ko: #ff8a80;
    --ombre: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .3); color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif; }
  a { color: var(--prim-2); }
  header { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 28px; padding: 0 28px; height: 60px;
    background: linear-gradient(90deg, #172a57, #26458a); color: #fff; box-shadow: 0 2px 12px rgba(0, 0, 0, .15); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.15rem; color: #fff; text-decoration: none; letter-spacing: .2px; }
  .logo svg { width: 30px; height: 30px; }
  .logo span b { color: #f2c14e; }
  nav { display: flex; gap: 4px; }
  nav a { color: rgba(255, 255, 255, .8); text-decoration: none; padding: 7px 14px; border-radius: 99px; font-weight: 550; }
  nav a:hover { background: rgba(255, 255, 255, .1); color: #fff; }
  nav a.actif { background: rgba(255, 255, 255, .18); color: #fff; }
  main { max-width: 1320px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; } h2 { font-size: 1.15rem; margin: 0 0 12px; } h3 { margin: 0; font-size: 1.02rem; }
  .sous-titre { color: var(--doux); margin: 0 0 24px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: var(--rayon); padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--ombre); }
  .ligne { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .espace { flex: 1; }
  .doux { color: var(--doux); font-size: .9rem; }
  button, .btn { font: inherit; font-weight: 550; padding: 8px 15px; border-radius: 9px; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  button:hover, .btn:hover { border-color: var(--prim-2); }
  button:disabled { opacity: .5; cursor: default; }
  .prim { background: var(--prim); border-color: var(--prim); color: #fff; } .prim:hover { background: var(--prim-2); }
  .mini { padding: 4px 10px; font-size: .85rem; }
  .icone { padding: 6px 9px; }
  input, textarea, select { font: inherit; color: var(--texte); background: var(--carte-2); border: 1px solid var(--bord); border-radius: 9px; padding: 8px 11px; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 2px solid color-mix(in srgb, var(--prim-2) 40%, transparent); border-color: var(--prim-2); background: var(--carte); }
  input[type=number] { width: 72px; } input[type=radio], input[type=checkbox] { width: auto; accent-color: var(--prim); }
  textarea { resize: vertical; min-height: 44px; }
  label.titre { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--doux); margin: 14px 0 5px; }
  code { background: var(--carte-2); border: 1px dashed var(--bord); padding: 5px 9px; border-radius: 7px; font-size: .9rem; }
  .badge { font-size: .74rem; font-weight: 650; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--bord); white-space: nowrap; color: var(--doux); }
  .b-nouveau { color: var(--prim-2); border-color: var(--prim-2); } .b-en_cours { color: var(--moyen); border-color: var(--moyen); }
  .b-rendu { color: var(--or); border-color: var(--or); } .b-corrige { color: var(--ok); border-color: var(--ok); }
  .ok { color: var(--ok); } .partiel { color: var(--moyen); } .faux { color: var(--ko); }
  .pre { white-space: pre-wrap; }

  /* accueil */
  .epreuves { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; margin-bottom: 26px; }
  .epreuve { display: flex; flex-direction: column; gap: 12px; margin: 0; border-top: 4px solid var(--prim); }
  .epreuve.crt { border-top-color: var(--or); } .epreuve.pp { border-top-color: var(--doux); opacity: .75; }
  .epreuve .options { display: grid; gap: 8px; }
  .epreuve .options label { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--bord); border-radius: 9px; cursor: pointer; flex-wrap: wrap; }
  .epreuve .options label:has(input:checked) { border-color: var(--prim-2); background: color-mix(in srgb, var(--prim-2) 8%, transparent); }
  .commande { display: flex; gap: 8px; align-items: center; margin-top: auto; }
  .commande code { flex: 1; overflow-wrap: anywhere; }
  .filtres { display: flex; gap: 6px; flex-wrap: wrap; }
  .filtres button.actif { background: var(--prim); border-color: var(--prim); color: #fff; }
  .histo { width: 100%; border-collapse: collapse; }
  .histo td { padding: 11px 8px; border-top: 1px solid var(--bord); vertical-align: middle; }
  .histo tr:hover td { background: var(--carte-2); }
  .histo td.actions { text-align: right; white-space: nowrap; }
  .vide { text-align: center; padding: 30px; color: var(--doux); }

  /* exercice */
  .barre-ex { position: sticky; top: 60px; z-index: 10; background: var(--fond); padding: 10px 0; margin: -10px 0 12px; }
  .grille { display: grid; grid-template-columns: 5fr 7fr; gap: 20px; align-items: start; }
  .theme { position: sticky; top: 124px; max-height: calc(100vh - 140px); overflow: auto; white-space: pre-wrap; text-align: justify; line-height: 1.7; }
  .rang { display: grid; grid-template-columns: 1fr 1fr 36px; gap: 8px; margin-bottom: 8px; }
  .timer { display: inline-flex; align-items: center; gap: 4px; padding: 4px 6px 4px 12px; border-radius: 99px; background: var(--carte); border: 1px solid var(--bord); font-variant-numeric: tabular-nums; }
  .timer b { font-size: 1.05rem; min-width: 70px; text-align: center; }
  .timer.fini b { color: var(--ko); } .timer.fini { border-color: var(--ko); }
  .timer button { border: 0; padding: 4px 8px; background: none; }
  .section { border-top: 1px solid var(--bord); padding: 10px 0; }
  details summary { cursor: pointer; font-weight: 650; color: var(--prim-2); padding: 6px 0; }

  /* tiroir documents */
  .tiroir { position: fixed; top: 60px; right: 0; bottom: 0; width: min(760px, 96vw); background: var(--carte); border-left: 1px solid var(--bord);
    box-shadow: -10px 0 30px rgba(0, 0, 0, .15); z-index: 30; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s; }
  .tiroir.ouvert { transform: none; }
  .tiroir .tete { padding: 12px 16px; border-bottom: 1px solid var(--bord); }
  .tiroir iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  .docs { display: grid; gap: 8px; }
  .doc { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border: 1px solid var(--bord); border-radius: 9px; }

  /* statistiques */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 18px; }
  .kpi { margin: 0; } .kpi .v { font-size: 1.9rem; font-weight: 750; } .kpi .l { color: var(--doux); font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; }
  .barres { display: grid; gap: 10px; }
  .barre { display: grid; grid-template-columns: 170px 1fr 60px; gap: 10px; align-items: center; font-size: .9rem; }
  .piste { display: flex; height: 12px; border-radius: 99px; overflow: hidden; background: var(--carte-2); }
  .piste span { height: 100%; } .s-ok { background: var(--ok); } .s-partiel { background: var(--moyen); } .s-faux { background: var(--ko); } .s-prim { background: var(--prim-2); }
  .colonnes { display: flex; align-items: flex-end; gap: 8px; height: 150px; border-bottom: 1px solid var(--bord); padding-top: 18px; }
  .colonnes div { flex: 1; max-width: 46px; background: var(--prim-2); border-radius: 6px 6px 0 0; position: relative; }
  .colonnes div span { position: absolute; top: -18px; width: 100%; text-align: center; font-size: .72rem; color: var(--doux); }
  .deux { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; }

  #toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); opacity: 0; transition: .2s; background: var(--texte); color: var(--fond); padding: 10px 18px; border-radius: 10px; z-index: 50; pointer-events: none; max-width: 90vw; }
  #toast.visible { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 900px) {
    header { padding: 0 14px; gap: 12px; } nav a { padding: 6px 9px; }
    .grille, .rang { grid-template-columns: 1fr; } .theme { position: static; max-height: none; }
    .barre { grid-template-columns: 1fr; } .histo td.actions { white-space: normal; }
  }
</style>
</head>
<body>
<header>
  <a class="logo" href="#">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="rgba(255,255,255,.12)"/><path d="M16 6v20M9 11h14M9 11l-3 7h6zM23 11l-3 7h6z" stroke="#f2c14e" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>
    <span>OPJ <b>Master</b></span>
  </a>
  <nav>
    <a href="#" data-nav="exercices">Exercices</a>
    <a href="#stats" data-nav="stats">Statistiques</a>
    <a href="#documents" data-nav="documents">Documents</a>
  </nav>
</header>
<main id="vue"></main>
<aside class="tiroir" id="tiroir" aria-label="Documents"></aside>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
const vue = document.getElementById("vue");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = (msg) => { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("visible"); clearTimeout(toast.m); toast.m = setTimeout(() => t.classList.remove("visible"), 2600); };
const copier = (texte, msg) => navigator.clipboard.writeText(texte).then(() => toast(msg || "Copié"), () => prompt("Copie ce texte :", texte));

// Site statique (GitHub Pages) : sujets et corrections sont des fichiers du dépôt ; copie, timer et documents vivent dans le navigateur
const lireJson = (chemin) => fetch(chemin, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const local = {
  lire(cle, defaut = null) { try { return JSON.parse(localStorage.getItem(cle)) ?? defaut; } catch { return defaut; } },
  ecrire(cle, val) { try { val == null ? localStorage.removeItem(cle) : localStorage.setItem(cle, JSON.stringify(val)); } catch { /* stockage indisponible */ } },
};
async function chargerSujet(id) {
  const [sujet, corr, copieFichier] = await Promise.all([lireJson(`data/sujets/${id}.json`), lireJson(`data/corrections/${id}.json`), lireJson(`data/copies/${id}.json`)]);
  if (!sujet) return {};
  const copie = local.lire("copie:" + id) || copieFichier;
  sujet.epreuve ||= "dps";
  sujet.statut = corr ? "corrige" : copie?.rendue_le ? "rendu" : copie ? "en_cours" : "nouveau";
  if (!corr) delete sujet.corrige; // le corrigé n'est affiché qu'après la correction
  return { sujet, corr, copie };
}
const chargerTous = async () => {
  const masques = local.lire("masques", []);
  const ids = ((await lireJson("data/sujets/index.json")) || []).filter((id) => !masques.includes(id));
  return (await Promise.all(ids.map(chargerSujet))).filter((x) => x.sujet);
};
const commandeCorriger = (id, copie) => `/corriger ${id} ${JSON.stringify(copie)}`;

// Ajouter une épreuve (PP) = une entrée ici + son formulaire dans exercice()
const EPREUVES = {
  dps: { nom: "DPG / DPS", long: "Droit pénal général et spécial", duree: 120, desc: "Trouver les infractions, les qualifier et justifier leurs éléments légal, matériel et moral." },
  crt: { nom: "CRT", long: "Compte rendu téléphonique", duree: 60, desc: "Rédiger le compte rendu au procureur de la République en 5 blocs (1 à 3 infractions)." },
  pp: { nom: "Procédure pénale", long: "Procédure pénale", duree: 240, desc: "Qualification, déroulé d'enquête (cadres et procès-verbaux) et questions pratiques." },
};
// Imprimés officiels à remplir (mode « formulaire PDF ») selon l'épreuve
const FORMULAIRES = { dps: ["102"], crt: ["101"], pp: ["101", "103"] };

/* ---- Procédure pénale : cadres et 25 procès-verbaux du GPS, rubriques de la méthodologie PP ---- */
const CADRES_PP = [["ep", "Enquête préliminaire"], ["fd", "Enquête de flagrance"], ["cr", "Commission rogatoire"], ["dc", "Découverte de cadavre"],
  ["dpgb", "Découverte de personne grièvement blessée"], ["di", "Disparition inquiétante"], ["rpf", "Recherche de personne en fuite"]];
const PV_PP = [["tcmp", "Transport, constatations et mesures prises"], ["perquisition", "Perquisition"], ["saisie", "Saisie"], ["saisie_incidente", "Saisie incidente"],
  ["bris_scelle", "Bris de scellé et restitution ou destruction"], ["audition_victime", "Audition de victime"], ["audition_representant_legal", "Audition du représentant légal"],
  ["audition_temoin", "Audition de témoin"], ["audition_anonymat", "Audition sous couvert d'anonymat"], ["audition_libre", "Notification des droits et audition libre"],
  ["retenue_judiciaire", "Retenue judiciaire (10-13 ans)"], ["gav_mineur", "Garde à vue (mineur 13-18 ans)"], ["gav_majeur", "Garde à vue (majeur)"],
  ["investigations", "Investigations"], ["interpellation", "Interpellation et remise à l'OPJ"], ["assistance_autopsie", "Assistance autopsie"],
  ["req_prestataire", "Réquisition à prestataire de service"], ["req_personne_qualifiee", "Réquisition à personne qualifiée"], ["req_remise_informations", "Réquisition aux fins de remise d'informations"],
  ["req_autorite_militaire", "Réquisition à autorité militaire"], ["req_geolocalisation", "Réquisition de géolocalisation"], ["req_sonorisation", "Réquisition de sonorisation et fixation d'images"],
  ["req_interception", "Réquisition d'interception"], ["transcription", "Transcription"], ["mandats", "Notification et exécution d'un mandat"]];
const nomPv = (k) => PV_PP.find((p) => p[0] === k)?.[1] || k;
const RUB_CADRE = [["cadre_legal", "Cadre légal", "Art. … du CPP"], ["justification", "Justification", "Nous sommes saisis le (date) à (heure) et les faits se sont produits le…"],
  ["competence", "Compétence de l'OPJ", "Les faits se déroulent sur la commune de …, placée dans le ressort… (art. 18, al. 1 et R. 15-24 du CPP)"]];
function rubriquesPv(acte) {
  const R = { date_heure_lieu: ["Date, heure et lieu", "Le (date) à (heure), à (lieu)"], enqueteurs: ["Enquêteur(s)", "Grade, nom, qualité, unité – assisté de… / sous le contrôle de l'OPJ…"],
    cadre_legal: ["Cadre légal", "Art. … du CPP + mentions (présence, assentiment, autorisation, extension de compétence…)"], motivation: ["Motivation", "Il s'agit de…"],
    saisine: ["Saisine", "Nécessité de… suite à (appel du CORG, plainte…) le (date) à (heure)"], notification_droits: ["Notification des droits", "… reçoit notification de ses droits."],
    elements_de_fond: ["Éléments de fond", "Résultats de l'acte et conséquences"] };
  const r = (k, l, ph) => [k, l || R[k][0], ph || R[k][1]];
  const base = [r("date_heure_lieu"), r("enqueteurs"), r("cadre_legal")];
  if (acte === "tcmp") return [...base, r("saisine"), r("elements_de_fond", null, "SITUATION À L'ARRIVÉE · MESURES PRISES · ÉTAT DES LIEUX · CORPS DU DÉLIT · MESURES DIVERSES")];
  if (acte === "audition_victime" || acte === "audition_representant_legal") return [...base, r("motivation"), r("notification_droits"), r("elements_de_fond", null, "Identité… / déclare : « … »")];
  if (acte === "audition_libre") return [...base, r("motivation"), r("notification_droits"), ["deroulement", "Déroulement de l'audition", "Information PR/JI, exercice des droits…"], r("elements_de_fond", null, "Déclarations")];
  if (/^gav|retenue/.test(acte)) return [["duree", "Durée de la mesure", "Ex. : 8 heures 30"], r("date_heure_lieu", "Date et heure du début de la mesure, lieu"), r("enqueteurs", "Mesure prise et notifiée par", "Grade, nom, OPJ, unité"),
    r("cadre_legal"), r("motivation", null, "Raisons plausibles de soupçonner… objectifs de l'art. 62-2"), r("notification_droits", null, "Placement, durée, infraction (qualification, date, lieu), motif, droits, art. 803-6…"),
    ["deroulement", "Déroulement de la mesure", "Information PR/JI sans délai…, droits exercés, repos/repas/auditions, fouille, prélèvements, fin de mesure…"], r("elements_de_fond", null, "Le mis en cause déclare : « … »")];
  if (acte === "mandats") return [...base, r("saisine"), r("notification_droits"), ["deroulement", "Déroulement de la mise à exécution", "…"], r("elements_de_fond")];
  return [...base, r("motivation"), r("elements_de_fond")];
}
const STATUT = { nouveau: "Nouveau", en_cours: "En cours", rendu: "Terminé", corrige: "Corrigé" };
const ICONE = { ok: "✅", partiel: "⚠️", faux: "❌" };
const nouvelleInfraction = () => ({ infraction: "", qualification: "", mis_en_cause: "", element_legal: "", elements_materiels: [{ element: "", justification: "" }], element_moral: { type: "", justification: "" } });
// Les 5 blocs du CRT (méthodologie CRT 2026) ; les actes d'enquête se divisent en réalisés / à réaliser
const BLOCS_CRT = [
  ["presentation", "1. Présentation (0,5 pt)", "Bonjour Madame/Monsieur le procureur de la République, grade, nom, qualité, unité…"],
  ["objet", "2. Objet (3 pts)", "Motif de l'appel, libellé complet des infractions, cadre juridique de l'enquête"],
  ["faits", "3. Les faits (4,5 pts)", "Saisine, lieu, date, victime(s), auteur(s), comment et pourquoi, retentissement éventuel"],
  ["actes_realises", "4. Actes d'enquête réalisés (4 pts)", "Procès-verbal de … : résultats obtenus…"],
  ["actes_a_realiser", "4. Actes d'enquête à réaliser (4 pts)", "Actes envisagés, motivés : réquisitions, auditions, GAV, perquisitions…"],
  ["qualification", "5. Qualification des infractions (4 pts)", "Infractions susceptibles d'être relevées à l'encontre de … : libellé avec circonstances aggravantes, délit ou crime, prévu et réprimé par les articles…"],
];
const dureeEpreuve = (ep) => local.lire("duree:" + ep, EPREUVES[ep].duree);
const fmtTemps = (s) => { const n = Math.abs(Math.round(s)), h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), x = n % 60;
  return (s < 0 ? "+" : "") + (h ? `${h}:${String(m).padStart(2, "0")}` : m) + ":" + String(x).padStart(2, "0"); };
// Note sur 20 : celle de la correction (CRT), sinon le taux de réussite des sections (✅ = 1, ⚠️ = 0,5)
function note20(corr) {
  const m = String(corr?.note || "").match(/([\d]+(?:[.,]\d+)?)\s*\/\s*20/);
  if (m) return parseFloat(m[1].replace(",", "."));
  const s = (corr?.sections || []).filter((x) => ICONE[x.statut]);
  return s.length ? Math.round(s.reduce((t, x) => t + ({ ok: 1, partiel: .5 }[x.statut] || 0), 0) / s.length * 200) / 10 : null;
}

/* ================= Accueil ================= */
async function accueil() {
  const tous = await chargerTous();
  let filtre = local.lire("filtre", "tous");
  vue.innerHTML = `
    <h1>Bonjour 👮</h1>
    <p class="sous-titre">Choisis une épreuve, génère un sujet avec Claude, compose, envoie, et retrouve ta correction ici.</p>
    <div class="epreuves">
      <section class="carte epreuve dps">
        <div class="ligne"><h2 style="margin:0">${EPREUVES.dps.long}</h2><span class="espace"></span><span class="badge">⏱ ${dureeEpreuve("dps")} min</span></div>
        <p class="doux" style="margin:0">${EPREUVES.dps.desc}</p>
        <div class="options">
          <label><input type="radio" name="dps" value="unitaire" checked> Unitaire · 1 infraction</label>
          <label><input type="radio" name="dps" value="multiple"> Multiple · entre
            <input type="number" id="min" value="2" min="2" max="8"> et <input type="number" id="max" value="4" min="2" max="8"> infractions</label>
        </div>
        <div class="commande"><code id="cmd-dps"></code><button class="prim" data-copier="cmd-dps">Copier</button></div>
      </section>
      <section class="carte epreuve crt">

        <p class="doux" style="margin:0">${EPREUVES.crt.desc}</p>

/* ================= Timer ================= */
function monterTimer(el, id, epreuve, verrouille, dureeSujet) {
  const etat = local.lire("timer:" + id) || { total: (dureeSujet || dureeEpreuve(epreuve)) * 60, ecoule: 0, depuis: null };
  const ecoule = () => etat.ecoule + (etat.depuis ? (Date.now() - etat.depuis) / 1000 : 0);
  const sauver = () => local.ecrire("timer:" + id, etat);
  const afficher = () => {
    const reste = etat.total - ecoule();
    el.className = "timer" + (reste < 0 ? " fini" : "");
    el.innerHTML = `<span title="Temps restant">⏱</span><b>${fmtTemps(reste)}</b>${verrouille ? "" : `
      <button data-t="go" title="${etat.depuis ? "Pause" : "Démarrer"}">${etat.depuis ? "⏸" : "▶"}</button>
      <button data-t="raz" title="Réinitialiser">↺</button><button data-t="regler" title="Régler la durée">⚙</button>`}`;
    if (reste < 0 && etat.depuis && !etat.alerte) { etat.alerte = true; sauver(); toast("⏱ Temps écoulé !"); }
  };
  el.onclick = (e) => {
    const t = e.target.dataset.t;
    if (t === "go") { etat.depuis ? (etat.ecoule = ecoule(), etat.depuis = null) : (etat.depuis = Date.now()); }
    else if (t === "raz") Object.assign(etat, { ecoule: 0, depuis: null, alerte: false });
    else if (t === "regler") {
      const min = parseInt(prompt(`Durée de l'épreuve ${EPREUVES[epreuve].nom}, en minutes (devient la durée par défaut) :`, Math.round(etat.total / 60)), 10);
      if (!(min > 0)) return;
      local.ecrire("duree:" + epreuve, min);
      Object.assign(etat, { total: min * 60, alerte: false });
    } else return;
    sauver();
    afficher();
  };
  afficher();
  const tic = setInterval(afficher, 1000);
  return { stop: () => { clearInterval(tic); if (etat.depuis) { etat.ecoule = ecoule(); etat.depuis = null; sauver(); } }, ecoule };
}

const db = () => new Promise((ok, ko) => {
  const r = indexedDB.open("opj-master", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("docs", { keyPath: "id", autoIncrement: true });
  r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error);
});
const docsOp = async (mode, fn) => { const base = await db(); return new Promise((ok, ko) => {
  const req = fn(base.transaction("docs", mode).objectStore("docs")); req.onsuccess = () => ok(req.result); req.onerror = () => ko(req.error); }); };
const listerDocs = () => docsOp("readonly", (s) => s.getAll());

/* ---- Documentation protégée (GPS, TACL, méthodologies, GPI) : publiée chiffrée, déchiffrée ici avec le mot de passe ---- */
let docsProteges = null;
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
async function deverrouiller(mdp) {
  const f = await lireJson("data/docs.chiffre.json");
  if (!f) throw new Error("Documentation introuvable");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
  const cle = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(f.sel), iterations: f.iterations, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(f.iv) }, cle, b64(f.donnees)); // lève une erreur si le mot de passe est faux
  docsProteges = JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
  try { sessionStorage.setItem("mdp-docs", mdp); } catch { /* stockage indisponible */ }
}
const sansAccent = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function chercher(q) {
  const termes = sansAccent(q).split(/\s+/).filter((t) => t.length > 1);
  if (!termes.length) return [];
  return docsProteges.map((d) => {
    const t = sansAccent(d.titre + " " + d.texte);
    if (!termes.every((x) => t.includes(x))) return null;
    return { d, score: termes.reduce((s, x) => s + t.split(x).length - 1 + (sansAccent(d.titre).includes(x) ? 20 : 0), 0) };
  }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 30).map((x) => x.d);
}
const surligner = (texte, q) => sansAccent(q).split(/\s+/).filter((t) => t.length > 1).reduce((html, t) =>
  html.replace(new RegExp(`(${t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").split("").map((c) => /[a-z]/.test(c) ? `[${c}${{ a: "àâä", e: "éèêë", i: "îï", o: "ôö", u: "ùûü", c: "ç" }[c] || ""}]` : c).join("")})`, "gi"), "<mark>$1</mark>"), esc(texte));
const blocRecherche = () => `<div id="recherche"><div class="ligne"><input type="search" id="q-docs" placeholder="Rechercher dans le GPS, le TACL, les méthodologies, le GPI… (ex. : assentiment perquisition)" style="flex:1"></div>
  <div id="res-docs" class="docs" style="margin-top:10px"></div></div>`;
const blocDeverrouillage = () => `<form id="form-mdp" class="ligne"><input type="password" id="mdp-docs" placeholder="Mot de passe de la documentation" style="flex:1" autocomplete="current-password">
  <button class="prim">Déverrouiller</button></form>`;
async function brancherRecherche(racine, apres) {
  if (!docsProteges) { const m = (() => { try { return sessionStorage.getItem("mdp-docs"); } catch { return null; } })(); if (m) await deverrouiller(m).catch(() => {}); }
  const zone = racine.querySelector("#zone-recherche");
  zone.innerHTML = docsProteges ? blocRecherche() : blocDeverrouillage();
  if (!docsProteges) {
    zone.querySelector("#form-mdp").onsubmit = async (e) => {
      e.preventDefault();
      try { await deverrouiller(zone.querySelector("#mdp-docs").value); toast("Documentation déverrouillée"); brancherRecherche(racine, apres); }
      catch { toast("Mot de passe incorrect"); }
    };
    return;
  }
  zone.querySelector("#q-docs").oninput = (e) => {
    const q = e.target.value;
    zone.querySelector("#res-docs").innerHTML = q.trim().length < 2 ? "" : (chercher(q).map((d) => `<details class="doc" style="display:block">
      <summary><span class="badge">${esc(d.source)}</span> ${surligner(d.titre, q)}</summary><div class="pre doux" style="margin-top:8px">${surligner(d.texte, q)}</div></details>`).join("")
      || `<p class="doux">Aucun résultat.</p>`);
    apres?.();
  };
}

  if (ep === "dps" && !copie.reponses.length) copie.reponses.push(nouvelleInfraction());

      ${r.elements_materiels.map((m, j) => `<div class="rang">
        ${champ(`reponses.${i}.elements_materiels.${j}.element`, m.element, "Élément constitutif")}
        ${champ(`reponses.${i}.elements_materiels.${j}.justification`, m.justification, "Justification tirée du sujet")}
        ${lecture ? "<span></span>" : `<button class="icone" data-suppr-em="${i}.${j}" title="Supprimer">×</button>`}</div>`).join("")}
      ${lecture ? "" : `<button class="mini" data-ajout-em="${i}">+ élément</button>`}
      <label class="titre">Élément moral</label>
      <div class="rang" style="grid-template-columns:1fr 2fr">
        <select data-c="reponses.${i}.element_moral.type" ${dis}>
          ${["", "Infraction intentionnelle", "Infraction non intentionnelle"].map((t) => `<option ${r.element_moral.type === t ? "selected" : ""} value="${t}">${t || "— choisir —"}</option>`).join("")}
        </select>
        ${champ(`reponses.${i}.element_moral.justification`, r.element_moral.justification, "Justification tirée du sujet")}
      </div>
    </div>`).join("");

  const formCrt = () => `<div class="carte">${BLOCS_CRT.map(([k, l, ph]) =>
    `<label class="titre">${l}</label>${champ(`blocs.${k}`, copie.blocs[k], ph)}`).join("")}</div>`;

  const outilsBloc = (i) => lecture ? "" : `<span class="espace"></span><button class="icone mini" data-monter="${i}" title="Monter">↑</button>
    <button class="icone mini" data-descendre="${i}" title="Descendre">↓</button><button class="icone mini" data-suppr-q2="${i}" title="Supprimer">×</button>`;
  const blocPp = (b, i) => b.type === "cadre" ? `
    <div class="carte" style="border-left:4px solid var(--prim)">
      <div class="ligne"><h3>Cadre d'enquête</h3>${outilsBloc(i)}</div>
      <label class="titre">Cadre juridique</label>
      <select data-c="q2.${i}.cadre_juridique" ${dis}><option value="">— choisir —</option>${CADRES_PP.map(([k, l]) => `<option value="${k}" ${b.cadre_juridique === k ? "selected" : ""}>${l}</option>`).join("")}</select>
      ${RUB_CADRE.map(([k, l, ph]) => `<label class="titre">${l}</label>${champ(`q2.${i}.${k}`, b[k], ph)}`).join("")}
    </div>` : `
    <div class="carte">
      <div class="ligne"><span class="badge">PV n° ${copie.q2.slice(0, i + 1).filter((x) => x.type === "pv").length}</span><h3>${esc(nomPv(b.acte))}</h3>${outilsBloc(i)}</div>
      <label class="titre">Procès-verbal de</label>${champ(`q2.${i}.intitule`, b.intitule, "Intitulé précis (objet, personne entendue, lieu…)", false)}
      ${rubriquesPv(b.acte).map(([k, l, ph]) => `<label class="titre">${l}</label>${champ(`q2.${i}.${k}`, b[k], ph)}`).join("")}
    </div>`;
  const formPp = () => `
    ${Q.q1 ? `<h2>Q1 · Qualification légale <span class="doux">/${sujet.points?.q1 ?? 4}</span></h2>
      <p class="doux">${esc(Q.q1.consigne || "")} Une phrase par infraction : libellé (avec les circonstances aggravantes), délit ou crime, prévu et réprimé par les articles…</p>
      ${copie.q1.map((it, i) => `<div class="carte"><div class="ligne"><b>À l'encontre de</b><span style="flex:1">${champ(`q1.${i}.mis_en_cause`, it.mis_en_cause, "Mis en cause", false)}</span>
        ${lecture || copie.q1.length < 2 ? "" : `<button class="icone mini" data-suppr-q1="${i}">×</button>`}</div>
        <div style="margin-top:8px">${champ(`q1.${i}.texte`, it.texte, "Vol commis dans un local d'habitation… délit prévu et réprimé par les articles … du Code pénal.")}</div></div>`).join("")}
      ${lecture ? "" : `<button class="mini" data-ajout-q1>+ infraction</button>`}` : ""}
    ${Q.q2 ? `<h2 style="margin-top:22px">Q2 · Déroulé d'enquête <span class="doux">/${sujet.points?.q2 ?? 26}</span></h2>
      <p class="doux">${esc(Q.q2.consigne || "Présentez de façon chronologique et analytique le ou les cadres d'enquête et les procès-verbaux.")}</p>
      ${(Q.q2.pv_a_rediger || []).length ? `<p class="doux"><b>PV à rédiger :</b> ${Q.q2.pv_a_rediger.map(esc).join(" · ")}</p>` : ""}
      ${(Q.q2.pv_a_ne_pas_rediger || []).length ? `<p class="doux"><b>PV à ne pas rédiger :</b> ${Q.q2.pv_a_ne_pas_rediger.map(esc).join(" · ")}</p>` : ""}
      ${copie.q2.map(blocPp).join("")}
      ${lecture ? "" : `<div class="carte ligne"><select id="type-pv" style="flex:1;min-width:220px">${PV_PP.map(([k, l]) => `<option value="${k}">${l}</option>`).join("")}</select>
        <button class="prim" data-ajout-pv>+ Procès-verbal</button><button data-ajout-cadre>+ Cadre d'enquête</button></div>`}` : ""}
    ${(Q.q3 || []).length ? `<h2 style="margin-top:22px">Q3 · Questions <span class="doux">/${sujet.points?.q3 ?? 10}</span></h2>
      ${Q.q3.map((q, i) => `<div class="carte"><div class="ligne"><b>Question ${i + 1}</b><span class="espace"></span><span class="badge">${q.points} pts</span></div>
        <p style="margin:6px 0 10px">${esc(q.enonce)}</p>${champ(`q3.${i}.texte`, copie.q3[i]?.texte, "Règle de droit (articles), puis « En l'espèce… »")}</div>`).join("")}` : ""}`;

  const formPdf = () => `<div class="carte">
    <h2>Réponse sur formulaire PDF</h2>
    ${lecture ? (copie.extraction ? `<p class="doux">Contenu lu dans ton formulaire :</p><div class="pre">${esc(copie.extraction)}</div>` : `<p class="doux">Réponse rédigée sur le formulaire PDF officiel.</p>`) : `
    <p>1. Télécharge le ou les imprimés de l'épreuve et remplis-les dans ton lecteur PDF (Acrobat Reader, navigateur…), puis enregistre-les :</p>
    <p class="ligne">${FORMULAIRES[ep].map((n) => `<a class="btn" href="formulaires/Formulaire_${n}_a_remplir.pdf" download>📄 Imprimé 651.4.${n}</a>`).join("")}</p>
    <p class="doux">Il te faut plus de feuilles ? Télécharge l'imprimé une seconde fois et numérote les feuilles (1/2, 2/2…).</p>
    <p>2. Clique sur « Envoyer ma réponse », colle la commande copiée dans Claude Code <b>et glisse tes PDF remplis dans le même message</b>.</p>`}
  </div>`;

  const rendre = () => {
    timer?.stop();
    vue.innerHTML = `
      <div class="barre-ex ligne">
        <a class="btn mini" href="#">← Exercices</a><span class="badge">${EPREUVES[sujet.epreuve].nom}</span>
        <b>${esc(sujet.titre)}</b><span class="badge b-${sujet.statut}">${STATUT[sujet.statut]}</span>
        ${copie.entrainement ? `<span class="badge" title="Documents consultés">📚 Entraînement</span>` : ""}
        <span class="espace"></span>
        <span id="timer"></span>
        ${lecture ? "" : `<span class="filtres"><button class="mini ${copie.mode === "pdf" ? "" : "actif"}" data-mode="en_ligne">✍️ En ligne</button><button class="mini ${copie.mode === "pdf" ? "actif" : ""}" data-mode="pdf">📄 Formulaire PDF</button></span>`}
        <button class="mini" id="docs">📚 Documents</button>
        <button class="mini icone" data-partager="${id}" title="Partager">🔗</button>
        ${lecture ? "" : `<button class="prim" id="envoyer">Envoyer ma réponse</button>`}
      </div>
      ${sujet.statut === "rendu" ? `<div class="carte" style="border-left:4px solid var(--or)">
        <b>Exercice terminé.</b> Colle cette commande (elle contient ta réponse) dans Claude Code${copie.mode === "pdf" ? " <b>avec tes formulaires PDF remplis</b>" : ""}, puis reviens ici une à deux minutes après la correction.
        <textarea readonly id="cmd-corriger" style="margin-top:10px">${esc(commandeCorriger(id, copie))}</textarea>
        <button class="prim" id="copier-corriger" style="margin-top:8px">Copier la commande</button></div>` : ""}
      ${sujet.statut === "corrige" ? vueCorrection(sujet, corr) : ""}
      <div class="grille">
        <div class="carte theme">${esc(sujet.theme)}</div>
        <div>
          ${copie.mode === "pdf" ? formPdf() : { dps: formDps, crt: formCrt, pp: formPp }[ep]()}
          ${lecture ? "" : `<div class="ligne" style="margin-top:12px">
            ${sujet.type === "multiple" && copie.mode !== "pdf" ? `<button id="ajout">+ Ajouter une infraction</button>` : ""}
            <span class="espace"></span><button class="prim" id="envoyer-bas">Envoyer ma réponse</button></div>`}
        </div>
      </div>`;
    vue.querySelectorAll("textarea").forEach((t) => (t.style.height = t.scrollHeight + 2 + "px"));
    timer = monterTimer(document.getElementById("timer"), id, sujet.epreuve, lecture, sujet.duree_minutes);
  };
  let timer = null;
  nettoyage = () => { timer?.stop(); document.getElementById("tiroir").classList.remove("ouvert"); };

  vue.onchange = null;
  vue.oninput = (e) => {
    const c = e.target.dataset.c;
    if (!c) return;
    const cles = c.split(".");
    cles.slice(0, -1).reduce((o, k) => o[k], copie)[cles.at(-1)] = e.target.value;
    sauver();
  };
  vue.onclick = async (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    const d = b.dataset;
    if (d.ajoutEm) copie.reponses[d.ajoutEm].elements_materiels.push({ element: "", justification: "" });
    else if (d.supprEm) { const [i, j] = d.supprEm.split("."); copie.reponses[i].elements_materiels.splice(j, 1); }
    else if (d.suppr) { if (!confirm("Supprimer cette infraction ?")) return; copie.reponses.splice(d.suppr, 1); }
    else if (b.id === "ajout") copie.reponses.push(nouvelleInfraction());
    else if (d.mode) copie.mode = d.mode;
    else if (d.ajoutQ1 != null) copie.q1.push({ mis_en_cause: copie.q1.at(-1)?.mis_en_cause || "", texte: "" });
    else if (d.supprQ1) copie.q1.splice(+d.supprQ1, 1);
    else if (d.ajoutPv != null) { const a = document.getElementById("type-pv").value; copie.q2.push({ type: "pv", acte: a, intitule: "" }); }
    else if (d.ajoutCadre != null) copie.q2.push({ type: "cadre", cadre_juridique: "" });
    else if (d.supprQ2) { if (!confirm("Supprimer ce bloc ?")) return; copie.q2.splice(+d.supprQ2, 1); }
    else if (d.monter || d.descendre) {
      const i = +(d.monter || d.descendre), j = d.monter ? i - 1 : i + 1;
      if (j < 0 || j >= copie.q2.length) return;
      [copie.q2[i], copie.q2[j]] = [copie.q2[j], copie.q2[i]];
    }
    else if (d.partager) return partager(id);
    else if (b.id === "docs") return ouvrirTiroir(sujet.epreuve, () => { if (!lecture && !copie.entrainement) { copie.entrainement = true; sauver(); } });
    else if (b.id === "copier-corriger") return copier(commandeCorriger(id, copie), "Commande copiée : colle-la dans Claude Code");
    else if (b.id === "envoyer" || b.id === "envoyer-bas") {
      if (!confirm("Envoyer ta réponse ? Elle ne pourra plus être modifiée.")) return;
      clearTimeout(minuteur);
      copie.temps_s = Math.round(timer.ecoule());
      copie.rendue_le = new Date().toISOString().slice(0, 19);
      local.ecrire("copie:" + id, copie);
      copier(commandeCorriger(id, copie), "Réponse envoyée : la commande /corriger est copiée, colle-la dans Claude Code");
      return exercice(id);
    } else return;
    sauver();
    rendre();
  };
  rendre();
}

/* ================= Statistiques ================= */
async function stats() {
  const tous = await chargerTous();
  const faits = tous.filter((x) => x.sujet.statut === "corrige");
  const kpi = (v, l) => `<div class="carte kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const moyenne = (l) => l.length ? (l.reduce((a, b) => a + b, 0) / l.length).toFixed(1).replace(".", ",") : "—";
  const notes = faits.map((x) => note20(x.corr)).filter((n) => n != null);
  const temps = tous.map((x) => x.copie?.temps_s).filter(Boolean);
  const parEpreuve = Object.entries(EPREUVES).filter(([, e]) => !e.bientot).map(([k, e]) => {
    const l = faits.filter((x) => x.sujet.epreuve === k);
    const n = l.map((x) => note20(x.corr)).filter((v) => v != null);
    return `<section class="carte"><h2>${e.long}</h2>
      <div class="ligne doux">${l.length} corrigé(s) · moyenne <b style="color:var(--texte)">${moyenne(n)}/20</b> · ${tous.filter((x) => x.sujet.epreuve === k && x.sujet.statut !== "corrige").length} en attente</div>
      ${n.length ? `<div class="colonnes">${l.map((x) => { const v = note20(x.corr); return v == null ? "" : `<div style="height:${Math.max(3, v * 5)}%" title="${esc(x.sujet.titre)}"><span>${String(v).replace(".", ",")}</span></div>`; }).reverse().join("")}</div>
        <p class="doux">Notes dans l'ordre chronologique (sur 20).</p>` : `<p class="doux">Pas encore de note.</p>`}</section>`;
  }).join("");
  // Réussite par type d'élément, d'après les titres des sections de correction
  const TYPES = [["Qualification", /qualif/i], ["Élément légal", /légal/i], ["Élément matériel", /matériel/i], ["Élément moral", /moral/i],
    ["Erreurs majeures", /majeure/i], ["Cadre d'enquête", /cadre/i], ["Procès-verbaux", /procès-verbal|PV/i], ["Questions de cours", /question/i], ["Objet (CRT)", /objet/i], ["Faits", /faits/i], ["Actes d'enquête", /actes/i], ["Pièges / oublis", /piège|oubli|en trop/i]];
  const barres = TYPES.map(([nom, re]) => {
    const s = faits.flatMap((x) => x.corr.sections || []).filter((x) => re.test(x.titre) && ICONE[x.statut]);
    if (!s.length) return "";
    const pct = (st) => s.filter((x) => x.statut === st).length / s.length * 100;
    return `<div class="barre"><span>${nom}</span><div class="piste"><span class="s-ok" style="width:${pct("ok")}%"></span><span class="s-partiel" style="width:${pct("partiel")}%"></span><span class="s-faux" style="width:${pct("faux")}%"></span></div><span class="doux">${Math.round(pct("ok"))} % ✅</span></div>`;
  }).join("");
  vue.innerHTML = `
    <h1>Statistiques</h1>
    <p class="sous-titre">Calculées à partir de tes exercices corrigés.</p>
    <div class="kpis">${kpi(faits.length, "Exercices corrigés")}${kpi(moyenne(notes) + '<span class="doux" style="font-size:1rem">/20</span>', "Moyenne générale")}
      ${kpi(temps.length ? fmtTemps(temps.reduce((a, b) => a + b, 0) / temps.length) : "—", "Temps moyen par exercice")}
      ${kpi(tous.filter((x) => x.copie?.entrainement).length + " / " + tous.filter((x) => x.copie?.rendue_le).length, "Faits en mode entraînement")}</div>
    <div class="deux">${parEpreuve}</div>
    <section class="carte"><h2>Réussite par type d'élément</h2>
      ${barres ? `<div class="barres">${barres}</div><p class="doux">✅ juste · ⚠️ partiel · ❌ faux</p>` : `<div class="vide">Les statistiques apparaîtront après ta première correction.</div>`}</section>`;
  vue.oninput = vue.onchange = vue.onclick = null;
}

/* ================= Routeur ================= */
let nettoyage = null;
function routeur() {
  nettoyage?.(); nettoyage = null;
  const h = location.hash.slice(1);
  const page = h === "stats" ? "stats" : h === "documents" ? "documents" : h ? "exercice" : "exercices";
  document.querySelectorAll("nav a").forEach((a) => a.classList.toggle("actif", a.dataset.nav === page || (page === "exercice" && a.dataset.nav === "exercices")));
  window.scrollTo(0, 0);
  ({ stats, documents, exercice: () => exercice(h), exercices: accueil })[page]();
}
window.onhashchange = routeur;
routeur();
</script>
