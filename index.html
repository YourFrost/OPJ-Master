<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Infraction Finder</title>
<style>
  :root { --fond:#f4f5f8; --carte:#fff; --bord:#d9dee8; --texte:#1b2233; --doux:#5a6378; --prim:#1d3a6e; --ok:#1e7a4c; --moyen:#9a6700; --ko:#b42318; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --fond:#11151d; --carte:#1a202b; --bord:#333d4e; --texte:#e6e9ef; --doux:#9aa4b8; --prim:#3f67b0; --ok:#5fd39a; --moyen:#f0c05a; --ko:#ff8a80; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fond); color: var(--texte); font: 15px/1.55 "Segoe UI", system-ui, sans-serif; }
  header { background: var(--prim); color: #fff; padding: 12px 24px; font-weight: 650; }
  header a { color: inherit; text-decoration: none; }
  main { max-width: 1300px; margin: 0 auto; padding: 24px 16px; }
  .carte { background: var(--carte); border: 1px solid var(--bord); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .ligne { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .doux { color: var(--doux); font-size: .9rem; }
  button, .btn { font: inherit; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--bord); background: var(--carte); color: var(--texte); cursor: pointer; text-decoration: none; }
  .prim { background: var(--prim); border-color: var(--prim); color: #fff; }
  input, textarea, select { font: inherit; color: var(--texte); background: var(--carte); border: 1px solid var(--bord); border-radius: 7px; padding: 7px 10px; width: 100%; }
  input[type=number] { width: 70px; } input[type=radio] { width: auto; }
  textarea { resize: vertical; min-height: 40px; }
  label.titre { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase; color: var(--doux); margin: 12px 0 4px; }
  code { background: var(--fond); border: 1px dashed var(--bord); padding: 4px 8px; border-radius: 6px; }
  .grille { display: grid; grid-template-columns: 5fr 7fr; gap: 20px; align-items: start; }
  .theme { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow: auto; white-space: pre-wrap; text-align: justify; }
  .rang { display: grid; grid-template-columns: 1fr 1fr 34px; gap: 8px; margin-bottom: 8px; }
  .badge { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--bord); }
  .rendu { color: var(--moyen); border-color: var(--moyen); } .corrige { color: var(--ok); border-color: var(--ok); }
  .ok { color: var(--ok); } .partiel { color: var(--moyen); } .faux { color: var(--ko); }
  .section { border-top: 1px solid var(--bord); padding: 8px 0; } .pre { white-space: pre-wrap; }
  @media (max-width: 850px) { .grille, .rang { grid-template-columns: 1fr; } .theme { position: static; max-height: none; } }
</style>
</head>
<body>
<header><a href="#">Infraction Finder · Examen OPJ</a></header>
<main id="vue"></main>
<script>
"use strict";
const vue = document.getElementById("vue");
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Site statique (GitHub Pages) : sujets et corrections sont des fichiers du dépôt, la copie vit dans le navigateur
const lireJson = (chemin) => fetch(chemin, { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
const copieLocale = (id) => { try { return JSON.parse(localStorage.getItem("copie:" + id)); } catch { return null; } };
const ecrireCopie = (id, copie) => { try { localStorage.setItem("copie:" + id, JSON.stringify(copie)); } catch { /* stockage indisponible */ } };
async function chargerSujet(id) {
  const [sujet, corr, copieFichier] = await Promise.all([lireJson(`data/sujets/${id}.json`), lireJson(`data/corrections/${id}.json`), lireJson(`data/copies/${id}.json`)]);
  if (!sujet) return {};
  const copie = copieLocale(id) || copieFichier;
  sujet.statut = corr ? "corrige" : copie?.rendue_le ? "rendu" : copie ? "en_cours" : "nouveau";
  if (!corr) delete sujet.corrige; // le corrigé n'est affiché qu'après la correction
  return { sujet, corr, copie };
}
const commandeCorriger = (id, copie) => `/corriger ${id} ${JSON.stringify(copie)}`;
const STATUT = { nouveau: "Nouveau", en_cours: "En cours", rendu: "Terminé", corrige: "Corrigé" };
const EPREUVE = { dps: "DPG / DPS", crt: "CRT" };
const ICONE = { ok: "✅", partiel: "⚠️", faux: "❌" };
const nouvelleInfraction = () => ({ infraction: "", qualification: "", mis_en_cause: "", element_legal: "", elements_materiels: [{ element: "", justification: "" }], element_moral: { type: "", justification: "" } });
// Les 5 blocs du CRT (méthodologie CRT 2026) ; les actes d'enquête se divisent en réalisés / à réaliser
const BLOCS_CRT = [
  ["presentation", "1. Présentation (0,5 pt)", "Bonjour Madame/Monsieur le procureur de la République, grade, nom, qualité, unité…"],
  ["objet", "2. Objet (3 pts)", "Motif de l'appel, libellé complet des infractions, cadre juridique de l'enquête"],
  ["faits", "3. Les faits (4,5 pts)", "Saisine, lieu, date, victime(s), auteur(s), comment et pourquoi, retentissement éventuel"],
  ["actes_realises", "4. Actes d'enquête réalisés (4 pts)", "Procès-verbal de … : résultats obtenus…"],
  ["actes_a_realiser", "4. Actes d'enquête à réaliser (4 pts)", "Actes envisagés, motivés : réquisitions, auditions, GAV, perquisitions…"],
  ["qualification", "5. Qualification des infractions (4 pts)", "Infractions susceptibles d'être relevées à l'encontre de … : libellé avec circonstances aggravantes, délit ou crime, prévu et réprimé par les articles…"],
];

/* ---------- Accueil : lancer un exercice + liste ---------- */
async function accueil() {
  const ids = (await lireJson("data/sujets/index.json")) || [];
  const sujets = (await Promise.all(ids.map(async (id) => (await chargerSujet(id)).sujet))).filter(Boolean);
  vue.innerHTML = `
    <div class="carte">
      <h2 style="margin-top:0">Lancer un exercice</h2>
      <p class="ligne"><b>DPG / DPS</b>
        <label><input type="radio" name="type" value="unitaire" checked> Unitaire (1 infraction)</label>
        <label><input type="radio" name="type" value="multiple"> Multiple : entre
          <input type="number" id="min" value="2" min="2" max="8"> et <input type="number" id="max" value="4" min="2" max="8"> infractions</label></p>
      <p class="ligne"><b>CRT</b> <label><input type="radio" name="type" value="crt"> Compte rendu téléphonique (1 à 3 infractions)</label></p>
      <p class="ligne">Colle cette commande dans Claude Code, puis actualise la page une à deux minutes plus tard :
        <code id="cmd"></code><button id="copier">Copier</button></p>
    </div>
    <div class="carte"><h2 style="margin-top:0">Mes exercices</h2>
      ${sujets.length ? sujets.map((s) => `<p class="ligne"><span class="badge ${s.statut}">${STATUT[s.statut]}</span>
        <span class="badge">${EPREUVE[s.epreuve || "dps"]}</span><a href="#${s.id}">${esc(s.titre)}</a>
        ${s.statut === "rendu" ? `<span class="doux">en attente de correction</span>` : ""}</p>`).join("") : `<p class="doux">Aucun exercice pour l'instant.</p>`}
    </div>`;
  const cmd = () => {
    const type = vue.querySelector("[name=type]:checked").value;
    let min = +vue.querySelector("#min").value, max = +vue.querySelector("#max").value;
    if (max < min) [min, max] = [max, min];
    return { unitaire: "/exercice unitaire", multiple: `/exercice multiple ${min}-${max}`, crt: "/exercice crt" }[type];
  };
  const maj = () => (vue.querySelector("#cmd").textContent = cmd());
  vue.oninput = maj;
  vue.onclick = null;
  vue.querySelector("#copier").onclick = () => navigator.clipboard.writeText(cmd()).catch(() => prompt("Copie :", cmd()));
  maj();
}

/* ---------- Correction et corrigé (une fois /corriger passé) ---------- */
function vueCorrection(sujet, corr) {
  const corrige = sujet.epreuve === "crt"
    ? BLOCS_CRT.map(([k, l]) => `<div class="section"><b>${l}</b><div class="pre">${esc(sujet.corrige?.[k])}</div></div>`).join("")
    : (sujet.corrige || []).map((c) => `<div class="section"><b>${esc(c.infraction)}</b> · ${esc(c.qualification)} · ${esc(c.mis_en_cause)}
        <div><i>Élément légal :</i> ${esc(c.element_legal)}</div>
        <div><i>Élément matériel :</i><ul>${c.elements_materiels.map((m) => `<li>${esc(m.element)} — <span class="doux">${esc(m.justification)}</span></li>`).join("")}</ul></div>
        <div><i>Élément moral :</i> ${esc(c.element_moral.type)} — <span class="doux">${esc(c.element_moral.justification)}</span></div></div>`).join("");
  return `
    <div class="carte">
      <h2 style="margin-top:0">Correction ${corr.note ? `· ${esc(corr.note)}` : ""}</h2>
      <p>${esc(corr.bilan)}</p>
      ${(corr.sections || []).map((s) => `<div class="section"><b class="${s.statut}">${ICONE[s.statut] || ""} ${esc(s.titre)}</b>
        ${s.points ? `<span class="badge">${esc(s.points)}</span>` : ""}<div class="pre">${esc(s.commentaire)}</div></div>`).join("")}
      ${(corr.conseils || []).length ? `<p><b>Conseils</b></p><ul>${corr.conseils.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>` : ""}
      <details><summary><b>Voir le corrigé</b></summary>${corrige}
        ${(sujet.pieges || []).length ? `<p><b>Pièges</b></p><ul>${sujet.pieges.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>` : ""}</details>
    </div>`;
}

/* ---------- Exercice : thème + réponses ---------- */
async function exercice(id) {
  const { sujet, corr, copie: copieLue } = await chargerSujet(id);
  if (!sujet) return accueil();
  const crt = sujet.epreuve === "crt";
  const copie = crt ? { blocs: {}, ...copieLue } : { reponses: [], ...copieLue };
  if (!crt && !copie.reponses.length) copie.reponses.push(nouvelleInfraction());
  const lecture = sujet.statut === "rendu" || sujet.statut === "corrige";
  const dis = lecture ? "disabled" : "";
  let minuteur;
  const sauver = () => { clearTimeout(minuteur); minuteur = setTimeout(() => ecrireCopie(id, copie), 400); };

  const champ = (chemin, val, ph, ta = true) => ta
    ? `<textarea data-c="${chemin}" placeholder="${esc(ph)}" ${dis}>${esc(val)}</textarea>`
    : `<input data-c="${chemin}" value="${esc(val)}" placeholder="${esc(ph)}" ${dis}>`;

  const formDps = () => copie.reponses.map((r, i) => `
    <div class="carte">
      <div class="ligne"><b>Infraction ${i + 1}</b>
        ${!lecture && copie.reponses.length > 1 ? `<button data-suppr="${i}" style="margin-left:auto">Supprimer</button>` : ""}</div>
      <label class="titre">Infraction</label>
      <div class="rang">${champ(`reponses.${i}.infraction`, r.infraction, "Ex. : vol aggravé", false)}
        <select data-c="reponses.${i}.qualification" ${dis}>${["", "Crime", "Délit"].map((q) => `<option ${r.qualification === q ? "selected" : ""} value="${q}">${q || "Crime ou délit ?"}</option>`).join("")}</select>
        <span></span></div>
      ${champ(`reponses.${i}.mis_en_cause`, r.mis_en_cause, "À l'encontre de…", false)}
      <label class="titre">Élément légal</label>
      ${champ(`reponses.${i}.element_legal`, r.element_legal, "Articles du Code pénal (et autres codes) qui définissent et répriment l'infraction")}
      <label class="titre">Élément matériel</label>
      ${r.elements_materiels.map((m, j) => `<div class="rang">
        ${champ(`reponses.${i}.elements_materiels.${j}.element`, m.element, "Élément constitutif")}
        ${champ(`reponses.${i}.elements_materiels.${j}.justification`, m.justification, "Justification tirée du sujet")}
        ${lecture ? "<span></span>" : `<button data-suppr-em="${i}.${j}" title="Supprimer">×</button>`}</div>`).join("")}
      ${lecture ? "" : `<button data-ajout-em="${i}">+ élément</button>`}
      <label class="titre">Élément moral</label>
      <div class="rang" style="grid-template-columns:1fr 2fr">
        <select data-c="reponses.${i}.element_moral.type" ${dis}>
          ${["", "Infraction intentionnelle", "Infraction non intentionnelle"].map((t) => `<option ${r.element_moral.type === t ? "selected" : ""} value="${t}">${t || "— choisir —"}</option>`).join("")}
        </select>
        ${champ(`reponses.${i}.element_moral.justification`, r.element_moral.justification, "Justification tirée du sujet")}
      </div>
    </div>`).join("");

  const formCrt = () => `<div class="carte">${BLOCS_CRT.map(([k, l, ph]) =>
    `<label class="titre">${l}</label>${champ(`blocs.${k}`, copie.blocs[k], ph)}`).join("")}</div>`;

  const rendre = () => {
    vue.innerHTML = `
      <p class="ligne"><a class="btn" href="#">← Exercices</a><span class="badge">${EPREUVE[sujet.epreuve || "dps"]}</span>
        <b>${esc(sujet.titre)}</b><span class="badge ${sujet.statut}">${STATUT[sujet.statut]}</span></p>
      ${sujet.statut === "rendu" ? `<div class="carte">Exercice terminé. Colle cette commande (elle contient ta réponse) dans Claude Code, puis actualise la page une à deux minutes après la correction :
        <textarea readonly id="cmd-corriger" style="margin-top:8px">${esc(commandeCorriger(id, copie))}</textarea>
        <button id="copier-corriger">Copier</button></div>` : ""}
      ${sujet.statut === "corrige" ? vueCorrection(sujet, corr) : ""}
      <div class="grille">
        <div class="carte theme">${esc(sujet.theme)}</div>
        <div>
          ${crt ? formCrt() : formDps()}
          ${lecture ? "" : `<div class="ligne">
            ${sujet.type === "multiple" ? `<button id="ajout">+ Ajouter une infraction</button>` : ""}
            <button class="prim" id="envoyer" style="margin-left:auto">Envoyer ma réponse</button></div>`}
        </div>
      </div>`;
    vue.querySelectorAll("textarea").forEach((t) => (t.style.height = t.scrollHeight + 2 + "px"));
  };

  vue.oninput = (e) => {
    const c = e.target.dataset.c;
    if (!c) return;
    const cles = c.split(".");
    cles.slice(0, -1).reduce((o, k) => o[k], copie)[cles.at(-1)] = e.target.value;
    sauver();
  };
  vue.onclick = async (e) => {
    const d = e.target.dataset;
    if (d.ajoutEm) copie.reponses[d.ajoutEm].elements_materiels.push({ element: "", justification: "" });
    else if (d.supprEm) { const [i, j] = d.supprEm.split("."); copie.reponses[i].elements_materiels.splice(j, 1); }
    else if (d.suppr && confirm("Supprimer cette infraction ?")) copie.reponses.splice(d.suppr, 1);
    else if (e.target.id === "ajout") copie.reponses.push(nouvelleInfraction());
    else if (e.target.id === "envoyer") {
      if (!confirm("Envoyer ta réponse ? Elle ne pourra plus être modifiée.")) return;
      clearTimeout(minuteur);
      copie.rendue_le = new Date().toISOString().slice(0, 19);
      ecrireCopie(id, copie);
      navigator.clipboard?.writeText(commandeCorriger(id, copie)).catch(() => {});
      return exercice(id);
    } else if (e.target.id === "copier-corriger") {
      return navigator.clipboard.writeText(commandeCorriger(id, copie)).catch(() => document.getElementById("cmd-corriger").select());
    } else return;
    sauver();
    rendre();
  };
  rendre();
}

const routeur = () => (location.hash.length > 1 ? exercice(location.hash.slice(1)) : accueil());
window.onhashchange = routeur;
routeur();
</script>
</body>
</html>
